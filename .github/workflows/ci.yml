name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: forte
          POSTGRES_PASSWORD: forte
          POSTGRES_DB: forte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forte -d forte_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      FORTE_TEST_DATABASE_URL: postgresql+psycopg://forte:forte@localhost:5432/forte_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
      - run: cp ../.env.example ../.env
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations match models
        run: FORTE_DATABASE_URL=$FORTE_TEST_DATABASE_URL uv run alembic upgrade head && FORTE_DATABASE_URL=$FORTE_TEST_DATABASE_URL uv run alembic check
      - name: Tests (storage + email in-memory, no MinIO needed)
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered
      - name: OpenAPI contract is up to date
        run: uv run python -m app.openapi > openapi.json && git diff --exit-code openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
