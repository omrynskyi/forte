[project]
name = "forte-api"
version = "0.1.0"
description = "Forte payroll MVP backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "cryptography>=43",
    "httpx>=0.27",
    "boto3>=1.35",      # S3 / MinIO object storage for paystub PDFs (D16)
    "reportlab>=4.2",   # paystub PDF rendering (A-12); pure Python, no Cairo/Pango system deps
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # asserts in tests
    "B008",  # FastAPI Depends() in defaults
    "E501",  # `ruff format` owns line length; long docstrings/comments are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/seed/**" = ["S105", "S106", "S311"]
"alembic/versions/**" = ["E", "F401", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is migrations, not the package
