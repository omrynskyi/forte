# Forte local stack. `make up` (or `docker compose up -d`) then open http://localhost:3000
#   db      Postgres 16                         localhost:5432
#   mailpit catches every email (magic links)   http://localhost:8025
#   minio   S3-compatible object storage        API http://localhost:9100, console http://localhost:9101
#           (host ports 9100/9101 so Forte never collides with another MinIO on 9000)
#   minio-init  one-shot: creates bucket forte-paystubs with versioning ON (payroll records: 4 years)
# The api and web services run on the host during development (`make api`, `make web`) for fast
# reload. `docker compose --profile app up` runs them in containers too (demo fallback).

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: forte
      POSTGRES_PASSWORD: forte
      POSTGRES_DB: forte
    ports: ["5432:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forte -d forte"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.20.4
    ports: ["1025:1025", "8025:8025"]

  # Official minio/minio images are no longer published on Docker Hub/Quay. pgsty/minio is the
  # community-maintained fork (same binary + bundled `mc`). Pinned; prod uses AWS S3 instead.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: forte
      MINIO_ROOT_PASSWORD: forte-dev-secret
    ports: ["${FORTE_MINIO_PORT:-9100}:9000", "${FORTE_MINIO_CONSOLE_PORT:-9101}:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 forte forte-dev-secret
        mc mb --ignore-existing local/forte-paystubs
        mc version enable local/forte-paystubs
        mc version info local/forte-paystubs
    restart: "no"

  api:
    profiles: ["app"]
    build: ./api
    env_file: .env
    environment:
      FORTE_DATABASE_URL: postgresql+psycopg://forte:forte@db:5432/forte
      FORTE_SMTP_HOST: mailpit
      FORTE_S3_ENDPOINT: http://minio:9000          # server-to-server, inside the network
      FORTE_API_BASE_URL: http://api:8000           # the mock payments provider calls back here
      # FORTE_S3_PUBLIC_ENDPOINT stays the browser-reachable host from .env (never minio:9000)
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  web:
    profiles: ["app"]
    build: ./web
    environment:
      FORTE_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db-data:
  minio-data:
